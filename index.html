<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SafeRide אבטיפוס</title>
<meta name="theme-color" content="#1F5B9E">
<meta name="description" content="אבטיפוס SafeRide: הסעות קהילתיות לחוגים. נתוני דמה בלבד.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SafeRide">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
/* SafeRide prototype v2 — follows SafeRide_Design_System_.md v1.3 and the /inspiration boards.
   Layout: phone-width column centred on the page, slim test bar on top (role, clock, reset). */
:root{
  /* brand tokens (Design System §2) */
  --primary:#1F5B9E; --primary-d:#174A82; --primary-t:#E4EEF9;
  --green:#5ACD81; --green-ink:#17402A; --green-d:#1E7A47; --green-t:#E3F6EA;
  --yellow:#FFC633; --yellow-ink:#3A2B00; --yellow-d:#7A5200; --yellow-t:#FFF5D6;
  --orange:#FF7F32; --orange-ink:#3B1A00; --orange-d:#B34A0A; --orange-t:#FFEBDD;
  --red:#D64545; --red-d:#A62E2E; --red-t:#FCE8E8;
  --violet-d:#5B43B0; --violet-t:#EDE8FB;
  --ink:#333333; --ink2:#64748B; --line:#DDE6EF; --app:#F7F9FC; --card:#FFFFFF;
  --shadow:0 4px 14px rgba(31,91,158,.10);
  --r:16px; --bar:#10253C;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E7EEF7;color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:middle}
.testbar{background:var(--bar);color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;position:relative;z-index:50}
.testbar b{font-weight:800}
.testbar.slim{flex-wrap:nowrap;gap:8px}.testbar.slim .tbrole{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.testbar.slim button,.testbar button[data-a]{white-space:nowrap}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
button,a,select,.card{touch-action:manipulation}
@media (max-width:480px){
 body{background:var(--app)}
 .shell{box-shadow:none;min-height:calc(100dvh - 48px)}
 .screen{min-height:calc(100dvh - 48px)}
 input,select,textarea,.in,.testbar select{font-size:16px}
 .testbar{padding:8px 12px}
 .testbar select{height:38px}
}.testbar label{display:flex;align-items:center;gap:6px;min-width:0}
.testbar select{background:#1D3A57;color:#fff;border:1px solid #35567A;border-radius:10px;height:32px;padding:0 8px;font:500 12.5px 'Heebo',sans-serif;max-width:100%}
.testbar button{background:transparent;color:#fff;border:1px solid #35567A;border-radius:10px;height:32px;padding:0 12px;font:700 12.5px 'Heebo',sans-serif}
.shell{max-width:440px;margin:0 auto;min-height:calc(100vh - 48px);background:var(--app);box-shadow:0 0 40px rgba(16,37,60,.12);position:relative}
.screen{padding-bottom:92px;min-height:calc(100vh - 48px);display:flex;flex-direction:column}
/* top bar */
.top{background:var(--primary);color:#fff;height:58px;display:flex;align-items:center;gap:4px;padding:0 6px;position:sticky;top:0;z-index:15}
.top h1{flex:1;margin:0;text-align:center;font-size:19px;font-weight:800;letter-spacing:.1px}
.ib{width:44px;height:44px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:12px;position:relative}
.ib.sp0{visibility:hidden}
.ib .badge{position:absolute;top:6px;left:6px}
.badge{min-width:18px;height:18px;border-radius:99px;background:var(--orange);color:var(--orange-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.logo{direction:ltr;font-weight:800;letter-spacing:-.6px;font-size:22px;display:inline-flex;align-items:center;gap:6px}
.top .logo i{font-style:normal;color:#fff}.top .logo u{text-decoration:none;color:#8EE5AB}
.logo i{font-style:normal;color:var(--primary)}.logo u{text-decoration:none;color:var(--green-d)}
.page{background:linear-gradient(180deg,#E6F0FB 0,var(--app) 240px);flex:1;padding-bottom:12px}
.greet{padding:16px 18px 6px}
.greet h2{margin:0;font-size:25px;font-weight:800;color:var(--primary);line-height:1.15}
.greet p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.pad{padding:8px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card.flat{box-shadow:none}
.card.tint-green{background:var(--green-t);border-color:#BFE8CE}
.card.tint-orange{background:var(--orange-t);border-color:#FFD2B3}
.card.tint-blue{background:var(--primary-t);border-color:#C9DDF3}
.card.tint-yellow{background:var(--yellow-t);border-color:#F6DE96}
button.card{text-align:right;font:inherit;width:100%}
.h2{margin:0;font-size:17px;font-weight:800;color:var(--primary)}
.small{font-size:12.5px;color:var(--ink2)}
.tag{font-size:13px;color:var(--ink2)}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--primary-t);color:var(--primary-d);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}
/* chips (state is always icon + word, never colour alone) */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip .ic{width:14px;height:14px}
.c-green{background:var(--green-t);color:var(--green-d)}.c-blue{background:var(--primary-t);color:var(--primary-d)}
.c-yellow{background:var(--yellow-t);color:var(--yellow-d)}.c-gray{background:#EAEFF4;color:#475569}
.c-red{background:var(--red-t);color:var(--red-d)}.c-orange{background:var(--orange-t);color:var(--orange-d)}
.d-to{background:var(--green-t);color:var(--green-d)}.d-from{background:var(--orange-t);color:var(--orange-d)}
/* avatars + activity tiles */
.av{width:44px;height:44px;flex:none;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:var(--primary-t);color:var(--primary)}
.av.v{box-shadow:0 0 0 3px var(--green)}.av.g{background:var(--green-t);color:var(--green-d)}.av.y{background:var(--yellow-t);color:var(--yellow-d)}.av.o{background:var(--orange-t);color:var(--orange-d)}
.av.lg{width:56px;height:56px;font-size:18px}.av.sm{width:36px;height:36px;font-size:13px}
.at{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center}
.at .ic{width:26px;height:26px}
.t-orange{background:var(--orange-t);color:var(--orange-d)}.t-blue{background:var(--primary-t);color:var(--primary)}
.t-violet{background:var(--violet-t);color:var(--violet-d)}.t-green{background:var(--green-t);color:var(--green-d)}
/* seat meter  3/4 + person icons */
.meter{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.meter .ppl{display:inline-flex;gap:1px}
.meter .ppl .ic{width:15px;height:15px;color:#C5D0DD}.meter .ppl .on{color:var(--green-d)}
/* buttons */
.btn{min-height:48px;border:0;border-radius:14px;font-weight:800;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px}
.btn.primary{background:var(--primary);color:#fff}
.btn.ok{background:var(--green);color:var(--green-ink)}
.btn.action{background:var(--orange);color:var(--orange-ink)}
.btn.warn{background:var(--yellow);color:var(--yellow-ink)}
.btn.rej{background:#fff;color:var(--red-d);border:1.5px solid var(--red)}
.btn.line{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.soft{background:#EAEFF4;color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{background:#E6EBF1;color:#8693A3;border-color:transparent;box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* stat tiles */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:var(--r);padding:12px 8px;text-align:center;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.stat .ic{width:26px;height:26px}
.stat b{font-size:28px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:#475569;font-weight:500}
button.stat{cursor:pointer}
.s-blue{background:var(--primary-t);color:var(--primary)}.s-green{background:var(--green-t);color:var(--green-d)}
.s-orange{background:var(--orange-t);color:var(--orange-d)}.s-violet{background:var(--violet-t);color:var(--violet-d)}
.s-red{background:var(--red-t);color:var(--red-d)}.s-yellow{background:var(--yellow-t);color:var(--yellow-d)}
/* direction tiles */
.dtile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dtile.to{border-top:4px solid var(--green)}.dtile.from{border-top:4px solid var(--orange)}
.dtile b.t{font-size:22px;font-weight:800;line-height:1}
/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lbl{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--ink)}
.lbl .ic{color:var(--primary);width:18px;height:18px}.req{color:var(--red-d)}
.in{height:46px;border:1.5px solid #9DB0C5;border-radius:12px;padding:0 12px;font:500 15px 'Heebo',sans-serif;background:#fff;color:var(--ink);width:100%}
.in.bad{border-color:var(--red)}
textarea.in{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.err{color:var(--red-d);font-size:12.5px;font-weight:700;display:flex;gap:4px;align-items:center}
.seg{display:flex;background:#EAEFF4;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:40px;font-weight:700;font-size:14px;color:#475569;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--primary);color:#fff}
.seg button.on.g{background:var(--green);color:var(--green-ink)}.seg button.on.o{background:var(--orange);color:var(--orange-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid #9DB0C5;background:#fff;border-radius:99px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:5px}
.pill.on{background:var(--primary-t);border-color:var(--primary);color:var(--primary-d)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--primary);background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center}
.stepper b{font-size:22px;min-width:32px;text-align:center}
.search{position:relative}
.search .ic{position:absolute;top:13px;right:12px;color:var(--ink2)}
.search .in{padding-right:40px}
/* nav */
.nav{position:fixed;bottom:0;right:0;left:0;z-index:20;pointer-events:none}
.nav>div{pointer-events:auto;max-width:440px;margin:0 auto;height:calc(68px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(31,91,158,.08)}
.nav button{flex:1;border:0;background:transparent;color:var(--ink2);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.nav button .ic{width:26px;height:26px}
.nav button.on{color:var(--primary);font-weight:800}
.nav button.on::before{content:"";position:absolute;top:0;width:32px;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
/* chat */
.chat{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 14px 8px}
.bub{max-width:88%;border-radius:16px;padding:10px 12px;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.bub.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-top-right-radius:4px}
.bub.me{background:var(--primary);color:#fff;align-self:flex-end;border-top-left-radius:4px}
.cards{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.composer{position:sticky;bottom:68px;background:#fff;border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:12}
.composer .in{flex:1}
.composer button{width:46px;height:46px;border:0;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1.5px solid var(--primary);background:#fff;color:var(--primary-d);border-radius:99px;min-height:40px;padding:0 14px;font-weight:700;font-size:13.5px}
.fakein{border:1.5px solid #9DB0C5;background:#fff;border-radius:12px;min-height:46px;padding:0 12px;color:var(--ink2);display:flex;align-items:center;gap:8px;text-align:right;width:100%;font-size:15px}
.toast{position:fixed;bottom:84px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,18,28,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:70}
.modal>div{background:#fff;border-radius:20px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.av.im{background:#fff;padding:0;overflow:hidden}.av.im img{width:100%;height:100%;display:block;border-radius:99px}.av.im.y{box-shadow:0 0 0 3px var(--yellow)}
.logo img{height:30px;width:auto;display:block}
.greet.il{display:flex;align-items:center;justify-content:space-between;gap:10px}
.greet.il>img{flex:none;width:auto;height:112px;margin-bottom:-6px}.greet.il>img.wide{height:96px}
.greet.il .av{flex:none}
.foot-ill{display:block;width:100%;height:auto;margin-top:18px;border-radius:16px}
.empty img{width:190px;max-width:70%;height:auto;margin-bottom:4px}
.empty{text-align:center;color:var(--ink2);padding:16px 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--primary);font-size:18px}
.sect{display:flex;align-items:center;justify-content:space-between;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14.5px}
.sect.to{background:var(--green-t);color:var(--green-d)}.sect.from{background:var(--orange-t);color:var(--orange-d)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}.kv span:first-child{color:var(--primary);font-weight:700}
.hero-ill{height:70px;margin:-6px -14px -14px;border-radius:0 0 16px 16px;overflow:hidden}
.sel-ok{outline:2.5px solid var(--green)}
@media (prefers-reduced-motion:no-preference){button.card{transition:transform .12s}button.card:active{transform:scale(.99)}}
</style>
</head>

  if(!f.days.length)e.days='חסר: לפחות יום אחד';

  if(!f.end)e.end='חסר: שעת סיום';
  else if(f.start&&f.end<=f.start)e.end='שעת הסיום חייבת להיות אחרי ההתחלה';
  if(Object.keys(e).length){S.errs=e;render();return}
  var a=v.id?D.acts[v.id]:null;
  if(!a){D.seq++;a=D.acts['a'+D.seq]={id:'a'+D.seq,tone:'green'}}
  a.name=f.name.trim();a.full='חוג '+a.name;a.place=f.place.trim();a.days=f.days.slice();a.start=f.start;a.end=f.end;a.icon=f.icon;
  toast('נשמר: '+a.full);
 }
 S.view=null;S.form=null;S.errs={};render();
}
function delForm(){
 var v=S.view;
 if(v.name==='parentForm'){delete D.parents[v.id];Object.keys(D.kids).forEach(function(k){if(D.kids[k].parent===v.id)D.kids[k].parent=null})}
 if(v.name==='kidForm'){var p=D.kids[v.id].parent;delete D.kids[v.id];syncChild(p)}
 if(v.name==='actForm'){delete D.acts[v.id];Object.keys(D.kids).forEach(function(k){D.kids[k].acts=D.kids[k].acts.filter(function(a){return a!==v.id})})}
 S.view=null;S.form=null;toast('נמחק');
}
/* ================= modals ================= */
function modalHtml(){
 var m=S.modal;if(!m)return '';
 var wrap=function(i){return '<div class="modal" role="dialog" aria-modal="true"><div>'+i+'</div></div>'};
 if(m.t==='cancel'){return wrap('<div class="row"><div class="av lg" style="background:var(--red-t);color:var(--red-d)">'+ic('x',28)+'</div><h2 style="margin:0;font-size:20px">לבטל את ההסעה?</h2></div><div class="tag">הביטול ישחרר את המקומות ויבטל גם את האישור הזמני של הילדים בכיוון השני.</div><button class="btn danger sm" data-a="doCancel" data-id="'+m.id+'">אישור ביטול ההסעה</button><button class="btn soft sm" data-a="closeModal">חזרה</button>')}
 if(m.t==='finish'){return wrap('<div class="row"><div class="at t-green">'+ic('flag')+'</div><h2 style="margin:0;font-size:20px">לסיים את ההסעה?</h2></div><div class="tag">דיווח הסיום יישמר ויעודכנו ההורים הרלוונטיים. הוא אינו מאשר הגעה של ילדים, ואי אפשר לדווח שוב.</div><button class="btn primary sm" data-a="doFinish" data-id="'+m.id+'">אישור, סיימתי את ההסעה</button><button class="btn soft sm" data-a="closeModal">חזרה</button>')}
 if(m.t==='ann'){var n=audCount(S.form.aud);return wrap('<h2 style="margin:0;font-size:20px">'+(m.mode==='now'?'לשלוח את ההודעה עכשיו?':'לתזמן את ההודעה?')+'</h2><div class="tag">"'+esc(S.form.title)+'" תישלח ל-'+n+' הורים'+(m.mode==='sched'?' ב-'+esc(S.form.date)+' '+esc(S.form.time):'')+'.</div><button class="btn ok sm" data-a="annDo" data-v="'+m.mode+'">'+(m.mode==='now'?'אישור ושליחה':'אישור ותזמון')+'</button><button class="btn soft sm" data-a="closeModal">חזרה</button>')}
 return '';
}
/* ================= render ================= */
function navItems(){
 var k=kind();
 if(k==='admin')return [['dash','דשבורד','home'],['parents','הורים','users'],['kids','ילדים','user'],['acts','חוגים','cal'],['ann','הודעות','mega']];
 if(k==='kid')return [['home','בית','home'],['chat','עוזר AI','chat']];
 return [['home','בית','home'],['acts','חוגים','cal'],['chat','עוזר AI','chat'],['profile','פרופיל','user']];
}
function viewRouter(){
 var v=S.view;
 switch(v.name){
  case 'join':return viewJoin();case 'detail':return viewDetail();case 'new':return viewNewRide();
  case 'search':return viewSearch();case 'myrides':return viewMyRides();case 'reqs':return viewReqs();case 'notifs':return viewNotifs();
  case 'chat':return viewChat(false);case 'parentForm':return viewParentForm();case 'kidForm':return viewKidForm();case 'actForm':return viewActForm();
 }
 return '';
}
function tabRouter(){
 var k=kind(),t=S.tab;
 if(k==='admin'){
  if(t==='dash')return viewDash();
  if(t==='parents')return viewAdmList('parents','ניהול הורים','חיפוש לפי שם, טלפון או שכונה','הורה חדש','parentForm',parentsList);
  if(t==='kids')return viewAdmList('kids','ניהול ילדים','חיפוש לפי שם, הורה, חוג או שכונה','ילד חדש','kidForm',kidsList);
  if(t==='acts')return viewAdmList('acts','ניהול חוגים','חיפוש לפי שם חוג או מקום','חוג חדש','actForm',actsList);
  return viewAnn();
 }
 if(k==='kid')return t==='chat'?viewChat(true):viewChildHome();
 if(t==='acts')return viewActs();if(t==='chat')return viewChat(true);if(t==='profile')return viewProfile();
 return viewHome();
}
function render(){
 var inner=S.view?viewRouter():tabRouter(),items=navItems();
 var sig=(S.view?S.view.name+(S.view.id||''):S.tab)+S.role;
 var roleLbl=(ROLES.filter(function(r){return r.k===S.role})[0]||{}).label||'';
 var tb=!S.tbOpen?'<div class="testbar slim"><b>אבטיפוס · נתוני דמה</b><span class="grow tbrole">'+esc(roleLbl)+'</span><button data-a="tbToggle" aria-expanded="false">החלפה</button></div>':'<div class="testbar"><b>אבטיפוס · נתוני דמה</b><button data-a="tbToggle" aria-expanded="true">סגירה</button><label>תפקיד <select id="selRole" aria-label="תפקיד">'+ROLES.map(function(r){return '<option value="'+r.k+'" '+(S.role===r.k?'selected':'')+'>'+r.label+'</option>'}).join('')+'</select></label><label>שעון <select id="selClock" aria-label="שעון המערכת">'+CLOCKS.map(function(c){return '<option value="'+c.k+'" '+(S.clock===c.k?'selected':'')+'>'+c.label+'</option>'}).join('')+'</select></label><button id="btnReset">איפוס</button></div>';
 var nav=S.view?'':'<nav class="nav" aria-label="ניווט"><div>'+items.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'" '+(S.tab===t[0]?'aria-current="page"':'')+'>'+ic(t[2])+t[1]+'</button>'}).join('')+'</div></nav>';
 var keepSf=document.querySelector('[data-search]'),qv=keepSf?keepSf.value:null;
 root.innerHTML=tb+'<main class="shell"><div class="screen">'+inner+'</div></main>'+nav+modalHtml()+(S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':'');
 if(sig!==S.sig){S.sig=sig;window.scrollTo(0,0)}
 if(S.view&&S.view.name==='chat'||(!S.view&&S.tab==='chat')){if(S.chatScroll){window.scrollTo(0,document.body.scrollHeight);S.chatScroll=false}}
 if(S.focus){var el=document.getElementById(S.focus);if(el)el.focus();S.focus=null}
}
function refreshList(key){
 var box=document.getElementById('listbox');if(!box)return;
 box.innerHTML=key==='parents'?parentsList():key==='kids'?kidsList():actsList();
}
/* ================= events ================= */
function after(){render()}
var H={
 tbToggle:function(){S.tbOpen=!S.tbOpen;render()},
 tab:function(d){S.tab=d.v;S.view=null;S.form=null;if(d.v==='ann'){S.form=annInit()}render()},
 back:function(){S.view=null;S.form=null;S.errs={};if(S.tab==='ann'&&!S.form)S.form=annInit();render()},
 notifs:function(){go({name:'notifs'})},
 goSearch:function(){go({name:'search'})},
 goSearchAct:function(d){S.sf={dir:'all',act:d.act,area:''};go({name:'search'})},
 myrides:function(){go({name:'myrides'})},
 reqs:function(){go({name:'reqs'})},
 actsTab:function(){S.tab='acts';S.view=null;render()},
 openJoin:function(d){startJoin(d.id)},
 newReq:function(d){var u=me(),kid=kidOf(u);var r=D.rides.filter(function(x){return x.act===d.act&&eligible(x,u)})[0]||D.rides.filter(function(x){return x.act===d.act&&x.driver===u.id&&x.dchild===kid.id})[0];if(!r){toast('אין כרגע הסעות פנויות בחוג הזה');return}startJoin(r.id)},
 pick:function(d){S.view.j[d.k]=d.id;render()},
 sendJoin:function(){sendJoin()},
 sfDir:function(d){S.sf.dir=d.v;render()},
 hist:function(d){S.hist=d.v==='1';render()},
 newRide:function(){S.open=initOpen();go({name:'new'})},
 oDir:function(d){S.open.dir=d.v;render()},
 seat:function(d){S.open.seats=Math.max(1,Math.min(8,S.open.seats+(+d.d)));render()},
 saveRide:function(){var o=S.open;if(openErrs(o).length)return;var r=createRide(o);S.view={name:'detail',id:r.id};toast('ההסעה נשמרה ומופיעה בחיפוש הסעה');},
 rideDetail:function(d){go({name:'detail',id:d.id})},
 decide:function(d){decide(d.q,d.d,d.ok==='1');render()},
 askFinish:function(d){S.modal={t:'finish',id:d.id};render()},
 doFinish:function(d){var r=ride(d.id);if(r.status==='completed'){S.modal=null;render();return}r.status='completed';r.doneAt=now().toISOString();S.modal=null;toast('דיווח סיום ההסעה נשמר. ההורים הרלוונטיים עודכנו.')},
 askCancel:function(d){S.modal={t:'cancel',id:d.id};render()},
 doCancel:function(d){cancelRide(ride(d.id));S.modal=null;S.view={name:'myrides'};S.hist=true;toast('ההסעה בוטלה והמקומות שוחררו')},
 closeModal:function(){S.modal=null;render()},
 guardArrive:function(d){var r=ride(d.id),k=kidOf(me());if(!k||approvedKids(r).indexOf(k.id)<0)return;if(windowState(r)!=='open'){toast('אפשר לאשר משעת ההסעה ועד סוף היום.');return}r.arr[k.id]=r.arr[k.id]||{};if(!r.arr[k.id].guardian_at)r.arr[k.id].guardian_at=now().toISOString();toast('אישור ההגעה נשמר')},
 kidArrive:function(d){var r=ride(d.id);if(approvedKids(r).indexOf('noam')<0)return;if(windowState(r)!=='open'){toast('אפשר לאשר משעת ההסעה ועד סוף היום.');return}r.arr.noam=r.arr.noam||{};if(!r.arr.noam.child_at)r.arr.noam.child_at=now().toISOString();toast('אישור ההגעה נשמר')},
 actTabSet:function(d){S.actTab=d.v;render()},
 fold:function(d){S.fold[d.id]=!S.fold[d.id];render()},
 logout:function(){S.role='michal';S.tab='home';S.view=null;render()},
 openChat:function(){if(isAdmin()){S.view={name:'chat'};render()}else{S.tab='chat';S.view=null;S.chatScroll=true;S.focus='chatIn';render()}},
 chatPrompt:function(d){H.openChat();chatSend(d.t);S.chatScroll=true;render()},
 chatConfirm:function(d){
  var c=S.chat.msgs[+d.i].cards[0];if(c.state!=='open')return;
  if(c.t==='preview'){var e=openErrs(c.f);if(e.length){c.state='cancelled';bot('לא נשמר: '+e[0]);S.chatScroll=true;render();return}var r=createRide(c.f);c.state='done';bot('',[{t:'result',id:r.id}])}
  if(c.t==='actPrev'){D.seq++;var id='a'+D.seq;D.acts[id]={id:id,name:c.f.name,full:'חוג '+c.f.name,place:'יעודכן',days:[c.f.day],start:c.f.start,end:c.f.end,icon:'ball',tone:'green'};c.state='done';bot('החוג נוצר. אפשר להשלים פרטים במסך החוגים.',[{t:'link',a:'goActs',l:'למסך החוגים'}])}
  S.chatScroll=true;render();
 },
 chatEdit:function(d){var c=S.chat.msgs[+d.i].cards[0];S.open=JSON.parse(JSON.stringify(c.f));c.state='cancelled';go({name:'new'})},
 chatCancel:function(d){S.chat.msgs[+d.i].cards[0].state='cancelled';bot('ביטלתי. שום דבר לא נשמר.');S.chatScroll=true;render()},
 chatAnn:function(d){var c=S.chat.msgs[+d.i].cards[0];S.form=annInit();S.form.aud=c.aud;S.annTab='new';S.view=null;S.tab='ann';render()},
 goActs:function(){S.view=null;S.tab='acts';render()},
 admGo:function(d){S.tab=d.v;S.view=null;if(d.v==='ann')S.form=annInit();render()},
 admOpen:function(d){openForm(d.v,d.id||null)},
 toggle:function(d){var l=S.form[d.f],i=l.indexOf(d.v);if(i>=0)l.splice(i,1);else l.push(d.v);delete S.errs[d.f];render()},
 setF:function(d){S.form[d.f]=d.v==='1';render()},
 formSave:function(){saveForm()},
 formDel:function(){delForm()},
 annTabSet:function(d){S.annTab=d.v;render()},
 annAsk:function(d){
  var f=S.form,e={};
  if(!f.title.trim())e.title='חסר: כותרת';if(!f.body.trim())e.body='חסר: תוכן ההודעה';
  if(d.v==='sched'){if(!f.date)e.date='חסר: תאריך';if(!f.time)e.time='חסר: שעה';if(f.date&&f.time&&new Date(f.date+'T'+f.time)<=now())e.date='מועד התזמון כבר עבר'}
  if(Object.keys(e).length){S.errs=e;render();return}
  S.errs={};S.modal={t:'ann',mode:d.v};render();
 },
 annDo:function(d){
  var f=S.form,n=now();D.seq++;
  D.ann.push({id:'n'+D.seq,title:f.title.trim(),body:f.body.trim(),aud:f.aud,status:d.v==='now'?'sent':'sched',when:d.v==='now'?fd(dstr(n)):fd(f.date)+' '+f.time});
  S.modal=null;S.form=annInit();S.annTab='sent';toast(d.v==='now'?'ההודעה נשלחה':'ההודעה תוזמנה');
 }
};
document.addEventListener('click',function(e){
 if(e.target.id==='btnReset'){D=seed();S.open=null;S.view=null;S.modal=null;S.form=null;S.hist=false;S.tab=isAdmin()?'dash':'home';S.clock='a';S.chat=newChat();S.sf={dir:'all',act:'',area:''};toast('האבטיפוס אופס');return}
 var el=e.target.closest('[data-a]');if(!el||el.disabled)return;
 var f=H[el.dataset.a];if(f)f(el.dataset,el);
});
document.addEventListener('submit',function(e){
 var f=e.target;if(f.dataset&&f.dataset.submit==='chatSend'){e.preventDefault();var i=document.getElementById('chatIn');var t=i.value;S.chatScroll=true;chatSend(t);render()}
});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.dataset.search){S.q[t.dataset.search]=t.value;refreshList(t.dataset.search);return}
 if(t.dataset.f&&S.form){S.form[t.dataset.f]=t.value;if(S.errs[t.dataset.f]){delete S.errs[t.dataset.f]}}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='selRole'){S.role=t.value;S.toast=null;S.view=null;S.modal=null;S.form=null;S.open=null;S.chat=newChat();S.tab=isAdmin()?'dash':'home';render();return}
 if(t.id==='selClock'){S.clock=t.value;render();return}
 if(t.dataset.sf){S.sf[t.dataset.sf]=t.value;render();return}
 if(t.dataset.o){var o=S.open;o[t.dataset.o]=t.value;if(t.dataset.o==='act'){var kk=kidOf(me());if(kk&&kk.acts.indexOf(o.act)<0&&o.seats<1)o.seats=1}render();return}
 if(t.dataset.f&&S.form){S.form[t.dataset.f]=t.value;if(S.tab==='ann'&&!S.view)return}
});
render();
})();
</script>
</body>
